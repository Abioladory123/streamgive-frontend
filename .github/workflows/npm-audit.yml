name: npm audit

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit
        run: npm audit --omit=dev --audit-level=high
